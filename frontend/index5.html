<script>
    // Mist Particle System
    const particleContainer = document.getElementById('particleContainer');
    function createMist() {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        const size = Math.random() * 150 + 50;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        const duration = Math.random() * 15 + 10;
        particle.style.animationDuration = duration + 's';
        particle.style.animationDelay = Math.random() * 5 + 's';
        particleContainer.appendChild(particle);
        setTimeout(() => particle.remove(), duration * 1000);
    }

    setInterval(createMist, 1000);
    for(let i = 0; i < 15; i++) setTimeout(createMist, i * 200);

    // Subtle cursor glow tracking
    const cursorGlow = document.getElementById('cursorGlow');
    document.addEventListener('mousemove', (e) => {
        cursorGlow.style.left = e.clientX + 'px';
        cursorGlow.style.top = e.clientY + 'px';
    });

    // Interaction handling
    document.getElementById('startJourneyBtn').addEventListener('click', () => {
        alert("The mist parts for you. Welcome to the training grounds of the Mist Hashira.");
    });

    // Scroll reveal for cards
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if(entry.isIntersecting) {
                entry.target.style.opacity = '1';
                entry.target.style.transform = 'translateY(0) scale(1)';
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.ds-card').forEach(card => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(40px) scale(0.95)';
        card.style.transition = 'all 0.8s cubic-bezier(0.2, 0.9, 0.3, 1)';
        observer.observe(card);
    });
</script>
