<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Library - Struct-Learn | Demon Slayer Code Corps</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0512, #020006);
            color: #f0e9e1;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navigation */
        .demon-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid #ff4d2e;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { font-size: 2rem; color: #ff4d2e; filter: drop-shadow(0 0 6px #ff4d2e); }
        .logo-text { font-weight: 800; font-size: 1.5rem; background: linear-gradient(135deg, #f7b42c, #fc575e); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo-sub { font-size: 0.7rem; color: #ffb347; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { text-decoration: none; color: #cbd5e1; font-weight: 600; transition: 0.2s; font-size: 0.9rem; }
        .nav-links a:hover { color: #ff8c5a; }
        .nav-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #ff4d2e, #ff8c5a); display: flex; align-items: center; justify-content: center; font-weight: 700; color: black; cursor: pointer; }

        .main-container { max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem; }

        /* Page Layout Split */
        .library-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .library-layout { grid-template-columns: 1fr; }
        }

        /* Filter Panel */
        .filter-panel {
            background: rgba(15, 8, 25, 0.85);
            border: 1px solid rgba(255, 77, 46, 0.15);
            border-radius: 28px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 90px;
        }
        .filter-section { margin-bottom: 1.5rem; padding-bottom: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .filter-section:last-child { border-bottom: none; }
        .filter-title { font-weight: 800; font-size: 0.95rem; text-transform: uppercase; color: #ff7b42; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 6px; }
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; color: #cbd5e1; }
        .checkbox-label input { accent-color: #ff4d2e; width: 16px; height: 16px; }

        /* Main library list */
        .list-section { display: flex; flex-direction: column; gap: 1rem; }

        /* Search & Sort Panel */
        .search-sort-panel {
            background: rgba(15, 8, 25, 0.8);
            border: 1px solid rgba(255, 77, 46, 0.1);
            border-radius: 24px;
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .search-wrapper { position: relative; flex: 1; min-width: 250px; }
        .search-wrapper input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 77, 46, 0.3);
            border-radius: 20px;
            padding: 10px 16px 10px 40px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .search-wrapper input:focus { border-color: #ff4d2e; box-shadow: 0 0 8px rgba(255,77,46,0.3); }
        .search-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #ff8c5a; }

        .sort-wrapper { display: flex; align-items: center; gap: 8px; }
        .sort-wrapper select {
            background: #180c22;
            border: 1px solid rgba(255, 77, 46, 0.3);
            color: #f0e9e1;
            padding: 8px 16px;
            border-radius: 20px;
            outline: none;
            cursor: pointer;
        }

        /* Problem Table */
        .problems-table-card {
            background: rgba(15, 8, 25, 0.85);
            border: 1px solid rgba(255, 77, 46, 0.15);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .problems-table { width: 100%; border-collapse: collapse; text-align: left; }
        .problems-table th { background: rgba(255, 77, 46, 0.08); padding: 1.2rem; color: #ff7b42; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; border-bottom: 2px solid rgba(255, 77, 46, 0.2); }
        .problems-table td { padding: 1.1rem 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
        .problems-table tr:hover td { background: rgba(255, 77, 46, 0.04); }
        
        .status-cell { font-size: 1.1rem; text-align: center; width: 60px; }
        .status-solved { color: #10b981; }
        .status-attempted { color: #f59e0b; }
        .status-unsolved { color: #64748b; }

        .title-cell a { text-decoration: none; color: #f0e9e1; font-weight: 700; transition: 0.2s; }
        .title-cell a:hover { color: #ff4d2e; }

        .diff-badge { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; padding: 3px 10px; border-radius: 12px; display: inline-block; }
        .diff-easy { color: #10b981; background: rgba(16, 185, 129, 0.15); }
        .diff-medium { color: #f59e0b; background: rgba(245, 158, 11, 0.15); }
        .diff-hard { color: #ef4444; background: rgba(239, 68, 68, 0.15); }

        .btn-bookmark { background: none; border: none; color: #475569; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .btn-bookmark.active { color: #fbbf24; filter: drop-shadow(0 0 3px #fbbf24); }
        .btn-bookmark:hover { transform: scale(1.2); }

        /* Pagination */
        .pagination-row { display: flex; justify-content: center; gap: 10px; margin-top: 1.5rem; align-items: center; }
        .btn-page { background: #1e112a; border: 1px solid rgba(255, 77, 46, 0.3); color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .btn-page:hover:not(:disabled) { background: #ff4d2e; border-color: #ff4d2e; color: black; }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info { font-size: 0.9rem; color: #94a3b8; }

        /* Cursor trail */
        .cursor-glow { width: 30px; height: 30px; background: radial-gradient(circle, rgba(255,80,40,0.4) 0%, rgba(255,40,0,0) 80%); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
    
        /* Dynamic premium back button */
        .back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            width: fit-content;
            cursor: pointer;
        }
        .back:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            transform: translateX(-4px);
        }
    </style>
</head>
<body>

<div class="cursor-glow" id="cursorGlow"></div>

<!-- Navigation Header -->
<nav class="demon-nav">
    <a href="/index.html" class="logo-area">
        <i class="fas fa-dragon logo-icon"></i>
        <div>
            <div class="logo-text">STRUCT-LEARN</div>
            <div class="logo-sub">Demon Slayer Code Corps</div>
        </div>
    </a>
    <div class="nav-links">
        <a href="/index.html"><i class="fas fa-home"></i> Home</a>
        <a href="/pages/dashboard/dashboard.html"><i class="fas fa-chalkboard-teacher"></i> Dashboard</a>
        <a href="/pages/quiz/quiz.html"><i class="fas fa-book"></i> Quiz</a>
        <a href="/pages/practice/practice.html" class="active"><i class="fas fa-keyboard"></i> Practice</a>
        <a href="/pages/editor/editor.html"><i class="fas fa-code"></i> Editor</a>
        <a href="/pages/practice/contests.html"><i class="fas fa-trophy"></i> Contests</a>
        <a href="/pages/practice/roadmaps.html"><i class="fas fa-map-signs"></i> Roadmaps</a>
        <a href="/pages/profile/profile.html"><i class="fas fa-user-ninja"></i> Profile</a>
    </div>
    <div class="nav-avatar" id="navAvatar" data-avatar-root>U</div>
</nav>

<div class="main-container">
        <a class="back" href="../dashboard/dashboard.html" onclick="if(document.referrer){ history.back(); return false; }">
            <i class="fas fa-arrow-left"></i> Back
        </a>

    <div class="library-layout">
        <!-- Sidebar Filters -->
        <aside class="filter-panel">
            <div class="filter-section">
                <div class="filter-title"><i class="fas fa-signal"></i> Difficulty</div>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" class="difficulty-filter" value="Easy"> Easy</label>
                    <label class="checkbox-label"><input type="checkbox" class="difficulty-filter" value="Medium"> Medium</label>
                    <label class="checkbox-label"><input type="checkbox" class="difficulty-filter" value="Hard"> Hard</label>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-title"><i class="fas fa-tags"></i> Topics</div>
                <div class="checkbox-group" style="max-height: 250px; overflow-y: auto; padding-right: 5px;">
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="Arrays"> Arrays</label>
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="Strings"> Strings</label>
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="Linked List"> Linked Lists</label>
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="Stack"> Stacks</label>
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="Queue"> Queues</label>
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="HashMap"> HashMaps</label>
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="Trees"> Trees</label>
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="Graphs"> Graphs</label>
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="Recursion"> Recursion</label>
                    <label class="checkbox-label"><input type="checkbox" class="topic-filter" value="DP"> Dynamic Programming</label>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-title"><i class="fas fa-tasks"></i> Status</div>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" class="status-filter" value="Solved"> Solved</label>
                    <label class="checkbox-label"><input type="checkbox" class="status-filter" value="Attempted"> Attempted</label>
                    <label class="checkbox-label"><input type="checkbox" class="status-filter" value="Unsolved"> Unsolved</label>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-title"><i class="fas fa-bookmark"></i> Bookmarked</div>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" id="bookmarkFilter"> Bookmarked Only</label>
                </div>
            </div>
        </aside>

        <!-- Problems list view -->
        <main class="list-section">
            <!-- Search & Sorting options -->
            <div class="search-sort-panel">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by problem title, topic, or ID...">
                </div>
                <div class="sort-wrapper">
                    <span style="font-size:0.85rem; color:#cbd5e1;">Sort By:</span>
                    <select id="sortSelect">
                        <option value="alphabetical">Alphabetical</option>
                        <option value="difficulty">Difficulty (Easy -> Hard)</option>
                        <option value="acceptanceRate">Acceptance Rate</option>
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                    </select>
                </div>
            </div>

            <!-- Problems Table Card -->
            <div class="problems-table-card">
                <table class="problems-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;">Status</th>
                            <th>Title</th>
                            <th style="width: 140px;">Difficulty</th>
                            <th style="width: 160px;">Topic</th>
                            <th style="width: 140px;">Acceptance</th>
                            <th style="width: 60px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="problemsTableBody">
                        <!-- Problems loaded dynamically -->
                        <tr>
                            <td colspan="6" style="text-align:center; padding:3rem; opacity:0.6;"><i class="fas fa-spinner fa-spin"></i> Initializing problem library...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination navigation -->
            <div class="pagination-row">
                <button class="btn-page" id="prevPageBtn" disabled><i class="fas fa-chevron-left"></i></button>
                <span class="page-info" id="pageInfo">Page 1 of 1</span>
                <button class="btn-page" id="nextPageBtn" disabled><i class="fas fa-chevron-right"></i></button>
            </div>
        </main>
    </div>
</div>

<script src="../../config/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script>
    // Theme linking
    const themeStyles = {
        flame: { primary: '#ff4d2e' },
        water: { primary: '#2e9eff' },
        thunder: { primary: '#ffd966' },
        mist: { primary: '#b8a9ff' },
        wind: { primary: '#5fdc7a' },
        sun: { primary: '#ffaa33' }
    };

    function applyDojoTheme(styleName) {
        if (!styleName) return;
        const key = styleName.toLowerCase();
        const theme = themeStyles[key];
        if (!theme) return;

        const nav = document.querySelector('.demon-nav');
        if (nav) nav.style.borderColor = theme.primary;
        
        document.querySelectorAll('.filter-panel, .problems-table-card, .search-sort-panel').forEach(el => {
            el.style.borderColor = `${theme.primary}25`;
        });
        document.querySelectorAll('.filter-title, th').forEach(el => {
            el.style.color = theme.primary;
        });
    }

    document.addEventListener('mousemove', (e) => {
        const glow = document.getElementById('cursorGlow');
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
    });

    let currentPage = 1;
    let limit = 20;

    async function loadProblems() {
        const searchInput = document.getElementById('searchInput').value;
        const sortBy = document.getElementById('sortSelect').value;
        
        // Accumulate checkboxes
        const diffCheckboxes = document.querySelectorAll('.difficulty-filter:checked');
        const difficulty = diffCheckboxes.length > 0 ? Array.from(diffCheckboxes).map(c => c.value).join(',') : '';

        const topicCheckboxes = document.querySelectorAll('.topic-filter:checked');
        const topic = topicCheckboxes.length > 0 ? Array.from(topicCheckboxes).map(c => c.value).join(',') : '';

        const statusCheckboxes = document.querySelectorAll('.status-filter:checked');
        const status = statusCheckboxes.length > 0 ? statusCheckboxes[0].value : ''; // Query supports single status filter

        const bookmarked = document.getElementById('bookmarkFilter').checked ? 'true' : '';

        try {
            const result = await Problems.getProblems({
                difficulty,
                topic,
                status,
                bookmarked,
                search: searchInput,
                sortBy,
                page: currentPage,
                limit
            });

            renderProblemsTable(result.problems);
            updatePaginationControls(result.page, result.pages);

        } catch (err) {
            console.error('Failed to load problems:', err);
        }
    }

    function renderProblemsTable(problems) {
        const body = document.getElementById('problemsTableBody');
        if (problems.length === 0) {
            body.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:3rem; opacity:0.6;"><i class="fas fa-ghost" style="font-size:2rem; display:block; margin-bottom:10px;"></i> No coding techniques found matching these training coordinates.</td></tr>`;
            return;
        }

        body.innerHTML = problems.map(prob => {
            let statusIcon = '<i class="far fa-circle status-unsolved"></i>';
            if (prob.status === 'Solved') {
                statusIcon = '<i class="fas fa-check-circle status-solved" title="Solved"></i>';
            } else if (prob.status === 'Attempted') {
                statusIcon = '<i class="fas fa-hourglass-half status-attempted" title="Attempted"></i>';
            }

            const bookmarkActive = prob.isBookmarked ? 'active' : '';

            return `
                <tr>
                    <td class="status-cell">${statusIcon}</td>
                    <td class="title-cell"><a href="problem.html?id=${prob._id}">${prob.title}</a></td>
                    <td><span class="diff-badge diff-${prob.difficulty.toLowerCase()}">${prob.difficulty}</span></td>
                    <td><span class="tag-badge">${prob.topic}</span></td>
                    <td><i class="fas fa-percentage" style="font-size:0.8rem; opacity:0.6;"></i> ${prob.acceptanceRate || 0}%</td>
                    <td>
                        <button class="btn-bookmark ${bookmarkActive}" onclick="toggleBookmark('${prob._id}', this)">
                            <i class="fas fa-bookmark"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    async function toggleBookmark(probId, button) {
        try {
            const res = await Bookmarks.toggleBookmark(probId, 'Favorites');
            if (res.bookmarked) {
                button.classList.add('active');
            } else {
                button.classList.remove('active');
            }
        } catch (err) {
            console.error('Failed to toggle bookmark:', err);
        }
    }

    function updatePaginationControls(page, totalPages) {
        currentPage = page;
        document.getElementById('pageInfo').innerText = `Page ${page} of ${totalPages || 1}`;
        document.getElementById('prevPageBtn').disabled = (page <= 1);
        document.getElementById('nextPageBtn').disabled = (page >= totalPages);
    }

    // Set up listeners
    document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            loadProblems();
        }
    });

    document.getElementById('nextPageBtn').addEventListener('click', () => {
        currentPage++;
        loadProblems();
    });

    // Inputs listener (re-fetch with debounce)
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            currentPage = 1;
            loadProblems();
        }, 300);
    });

    document.getElementById('sortSelect').addEventListener('change', () => {
        currentPage = 1;
        loadProblems();
    });

    // Inputs panel change listeners
    document.querySelectorAll('.difficulty-filter, .topic-filter, .status-filter, #bookmarkFilter').forEach(input => {
        input.addEventListener('change', () => {
            currentPage = 1;
            loadProblems();
        });
    });

    async function initPage() {
        const token = localStorage.getItem('token');
        if (token) {
            try {
                const profile = await Auth.getProfile();
                applyDojoTheme(profile.breathingStyle);
                
                const avatar = document.getElementById('navAvatar');
                if (profile.avatar) {
                    avatar.innerHTML = `<img src="${profile.avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                } else {
                    avatar.innerText = profile.username.charAt(0).toUpperCase();
                }
            } catch (err) {}
        }
        loadProblems();
    }

    document.addEventListener('DOMContentLoaded', initPage);
</script>
</body>
</html>
