<script>
        // Particle System (Scratches and Dust)
        const particleContainer = document.getElementById('particleContainer');
        function createSlash() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const isDust = Math.random() > 0.7;
            const sizeW = isDust ? Math.random() * 4 + 1 : Math.random() * 100 + 50;
            const sizeH = isDust ? Math.random() * 4 + 1 : 1;
            
            particle.style.width = sizeW + 'px';
            particle.style.height = sizeH + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            
            const duration = Math.random() * 3 + 1;
            particle.style.animation = `slashEffect ${duration}s linear forwards`;
            
            particleContainer.appendChild(particle);
            setTimeout(() => { particle.remove(); }, duration * 1000);
        }

        setInterval(createSlash, 200);

        // Rugged Button Interaction
        const beastBtns = document.querySelectorAll('.btn-beast');
        beastBtns.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                btn.style.transform = `rotate(${Math.random() * 2 - 1}deg) scale(1.05)`;
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'rotate(0deg) scale(1)';
            });
        });

        // Scroll Observer for cards
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0) rotate(' + (Math.random() * 2 - 1) + 'deg)';
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.beast-card').forEach(card => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(40px)';
            card.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            observer.observe(card);
        });

        console.log("%c🐗 BEAST BREATHING ACTIVATED 🐗\n\"Total Instinct — Devour Data Structures!\"", "color: #2dd4bf; font-size: 16px; font-weight: bold; font-family: 'Permanent Marker'");
    </script>
