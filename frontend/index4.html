        /* Speed Lines Background */
        .bg-speed-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0.15;

        @keyframes lightning-strike {

            5% { opacity: 0.8; }
            10% { opacity: 0; }
            15% { opacity: 1; }

        /* ===== SPEED-TRAIL CARDS ===== */
        .card-grid {
            display: grid;

            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .thunder-card {
            background: #111;
            padding: 3rem 2rem;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            border-left: 4px solid #FFEC00;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-decoration: none;
            color: inherit;
        }

        .thunder-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 236, 0, 0.1), transparent);
            transition: 0.5s;
        }

        .thunder-card:hover {
            background: #181818;
            transform: translateX(10px);
            border-left-width: 8px;
        }

        .thunder-card:hover::before {
            left: 100%;
        }

        /* Speed trail effect on hover */
        .thunder-card::after {
            content: '';
            position: absolute;
            right: -20px;
            bottom: -20px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 236, 0, 0.15) 0%, transparent 70%);
            opacity: 0;
            transition: 0.3s;
        }

        .thunder-card:hover::after {
            opacity: 1;
            transform: scale(2);
        }

        .card-icon {

        /* ===== SPEED STATS ===== */

<script>
    // Lightning generator
    const lightningContainer = document.getElementById('lightningContainer');
    function createLightning() {
        const bolt = document.createElement('div');
        bolt.className = 'lightning-bolt';
        bolt.style.left = Math.random() * 100 + 'vw';
        bolt.style.height = (Math.random() * 50 + 20) + 'vh';
        bolt.style.animationDuration = (Math.random() * 2 + 3) + 's';
        bolt.style.animationDelay = Math.random() * 5 + 's';
        lightningContainer.appendChild(bolt);
        
        setTimeout(() => {
            bolt.remove();
        }, 10000);
    }

    // Initial bolts
    for(let i=0; i<15; i++) createLightning();
    setInterval(createLightning, 1500);

    // Speed Trail Effect for Mouse
    document.addEventListener('mousemove', (e) => {
        if(Math.random() > 0.8) {
            const trail = document.createElement('div');
            trail.style.position = 'fixed';
            trail.style.width = '4px';
            trail.style.height = '4px';
            trail.style.background = '#FFEC00';
            trail.style.borderRadius = '50%';
            trail.style.left = e.clientX + 'px';
            trail.style.top = e.clientY + 'px';
            trail.style.pointerEvents = 'none';
            trail.style.zIndex = '9999';
            trail.style.boxShadow = '0 0 10px #FFEC00';
            document.body.appendChild(trail);
            
            const anim = trail.animate([
                { opacity: 1, transform: 'scale(1)' },
                { opacity: 0, transform: 'scale(4)' }
            ], { duration: 500 });
            
            anim.onfinish = () => trail.remove();
        }
    });

    console.log("%c⚡ THUNDER BREATHING VARIANT LOADED ⚡", "color: #FFEC00; font-weight: 900; font-size: 20px; font-style: italic;");
</script>
