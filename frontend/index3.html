<script>
    // Minimalist Slash Particles (Thin Vertical Streaks)
    const slashContainer = document.getElementById('slashContainer');
    function createSlash() {
        const slash = document.createElement('div');
        slash.classList.add('slash');
        
        const left = Math.random() * 100;
        const duration = 0.5 + Math.random() * 1.5;
        const delay = Math.random() * 5;
        const height = 50 + Math.random() * 200;

        slash.style.left = left + '%';
        slash.style.animationDuration = duration + 's';
        slash.style.animationDelay = delay + 's';
        slash.style.height = height + 'px';
        
        slashContainer.appendChild(slash);

        // Clean up
        setTimeout(() => {
            slash.remove();
        }, (duration + delay) * 1000);
    }

    // Initial burst
    for(let i = 0; i < 20; i++) createSlash();
    // Continuous generation
    setInterval(createSlash, 200);

    // Custom Cursor Dot
    const cursorDot = document.getElementById('cursorDot');
    document.addEventListener('mousemove', (e) => {
        cursorDot.style.left = e.clientX + 'px';
        cursorDot.style.top = e.clientY + 'px';
    });

    // Start Journey Handler
    document.getElementById('startJourneyBtn').addEventListener('click', () => {
        alert("PROTOCOL INITIATED: Deployment sequence starting...");
    });

    // Logout / Login toggle mock
    const loginBtn = document.getElementById('loginBtn');
    let loggedIn = localStorage.getItem('token');
    if (loggedIn) {
        loginBtn.innerText = 'Auth_Signout';
        loginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('token');
            location.reload();
        });
    }

    console.log("%c[SYSTEM]: SHADOW HASHIRA UI LOADED", "color: #ff5f1f; font-weight: bold;");
</script>
